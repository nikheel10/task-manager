version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: task_amc_db
    environment:
      POSTGRES_DB: task_amc
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_amc"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: